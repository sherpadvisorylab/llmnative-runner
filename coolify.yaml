# A server as a Coolify resource ("Docker Compose Empty"): one dispatcher for every organization of
# /opt/playbook/organizations, the domain given to the service dispatcher (https://agents.<domain>:8080).
# Every image takes its release from the variable PLAYBOOK_VERSION of the resource (e.g. 0.16.0): an
# update changes it and redeploys, the compose stays as it is.
services:
  dispatcher:
    image: ghcr.io/sherpadvisorylab/playbook-dispatcher:${PLAYBOOK_VERSION}
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      ORGANIZATIONS_DIR: /organizations
      PORT: "8080"
      AGENT_IMAGE: ghcr.io/sherpadvisorylab/playbook-agent:${PLAYBOOK_VERSION}
      MAX_PARALLEL: "1"
      DESIGN_IMAGES: "ghcr.io/sherpadvisorylab/playbook-design-matt:${PLAYBOOK_VERSION} ghcr.io/sherpadvisorylab/playbook-design-bmad:${PLAYBOOK_VERSION}"
      DESIGN_MAX_SESSIONS: "2"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/playbook/organizations:/organizations:ro
      # The admin token of the runner (scripts/server-admin.mjs): its page in the studio manages the images.
      - /opt/playbook/admin:/admin:ro
      - dispatcher-data:/data
    expose:
      - "8080"

volumes:
  dispatcher-data:
