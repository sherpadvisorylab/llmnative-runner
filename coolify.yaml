# A runner as a Coolify resource ("Docker Compose Empty"): one dispatcher for every company of
# /opt/playbook/companies, the domain given to the service dispatcher (https://agents.<domain>:8080).
services:
  dispatcher:
    image: ghcr.io/sherpadvisorylab/playbook-dispatcher:0.11.0
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      COMPANIES_DIR: /companies
      PORT: "8080"
      AGENT_IMAGE: ghcr.io/sherpadvisorylab/playbook-agent:0.11.0
      MAX_PARALLEL: "1"
      DESIGN_IMAGES: "ghcr.io/sherpadvisorylab/playbook-design-matt:0.11.0 ghcr.io/sherpadvisorylab/playbook-design-bmad:0.11.0"
      DESIGN_MAX_SESSIONS: "2"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/playbook/companies:/companies:ro
      # The admin token of the runner (scripts/runner-admin.mjs): its page in the studio manages the images.
      - /opt/playbook/admin:/admin:ro
      - dispatcher-data:/data
    expose:
      - "8080"

volumes:
  dispatcher-data:
