# A runner as a Coolify resource ("Docker Compose Empty"): one dispatcher for every company of
# /opt/playbook/companies, the domain given to the service dispatcher (https://agents.<domain>:8080).
services:
  dispatcher:
    image: ghcr.io/sherpadvisorylab/playbook-dispatcher:latest
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      COMPANIES_DIR: /companies
      PORT: "8080"
      AGENT_IMAGE: ghcr.io/sherpadvisorylab/playbook-agent:1.19.3
      MAX_PARALLEL: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/playbook/companies:/companies:ro
      - dispatcher-data:/data
    expose:
      - "8080"

volumes:
  dispatcher-data:
