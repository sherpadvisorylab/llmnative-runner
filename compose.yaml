# A runner: one dispatcher for every company of /opt/playbook/companies (each with its own .env), the
# agent image it starts one turn at a time, the design image it starts for each design session and, on
# a machine without a reverse proxy, Caddy for HTTPS.
# The studio writes this same file, filled in, in the guide of each runner (Runners → the runner).
#   RUNNER_DOMAIN=agents.example.com docker compose up -d
name: playbook-runner

services:
  dispatcher:
    image: ${DISPATCHER_IMAGE:-ghcr.io/sherpadvisorylab/playbook-dispatcher:0.11.0}
    build: ./dispatcher
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      COMPANIES_DIR: /companies
      PORT: "8080"
      AGENT_IMAGE: ${AGENT_IMAGE:-ghcr.io/sherpadvisorylab/playbook-agent:0.11.0}
      # Turns at once on the whole machine, every company together.
      MAX_PARALLEL: ${MAX_PARALLEL:-2}
      # The design agents, one image per kit, separated by spaces.
      DESIGN_IMAGES: ${DESIGN_IMAGES:-ghcr.io/sherpadvisorylab/playbook-design-matt:0.11.0}
      # Design sessions at once on the whole machine (about 1 GB of RAM each while active).
      DESIGN_MAX_SESSIONS: ${DESIGN_MAX_SESSIONS:-2}
    volumes:
      # The dispatcher starts the agent containers next to itself.
      - /var/run/docker.sock:/var/run/docker.sock
      # One folder per company with its .env (scripts/runner-env.mjs); read again every half minute.
      - /opt/playbook/companies:/companies:ro
      # The admin token of the runner (scripts/runner-admin.mjs): its page in the studio manages the images.
      - /opt/playbook/admin:/admin:ro
      - dispatcher-data:/data

  # Built here, never started by compose: the dispatcher runs it once per turn (AGENT_IMAGE).
  agent:
    build: ./agent
    image: ${AGENT_IMAGE:-ghcr.io/sherpadvisorylab/playbook-agent:1.19.3}
    profiles: ["build"]

  # Built here, never started by compose: the dispatcher runs them once per design session (DESIGN_IMAGES).
  design-matt:
    build: ./designer
    image: ghcr.io/sherpadvisorylab/playbook-design-matt:latest
    profiles: ["build"]

  design-bmad:
    build:
      context: ./designer
      dockerfile: Dockerfile.bmad
    image: ghcr.io/sherpadvisorylab/playbook-design-bmad:latest
    profiles: ["build"]

  # HTTPS on plain Docker; on Coolify leave it out and give the service dispatcher the domain.
  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    command: caddy reverse-proxy --from ${RUNNER_DOMAIN:-} --to dispatcher:8080
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
    profiles: ["proxy"]

volumes:
  dispatcher-data:
  caddy-data:
