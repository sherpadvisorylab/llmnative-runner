# Publish: a release, from a tag v<version> (the version of package.json): the gates, then the images on GHCR (runner and
# agent, amd64 and arm64), the GitHub release with install.sh and its checksum, and the package on npm through
# trusted publishing (npm trusts this workflow: package Settings → Trusted Publisher; no token stored anywhere).
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
env:
  REGISTRY: ghcr.io/sherpadvisorylab
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: 'npm'
      - name: The tag is the version of the package
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm ci
      - run: npm run typecheck
      # Before the tests: the test of the setup page imports the built files.
      - run: npm run build
      - run: npm test
      - run: sh -n install/install.sh

  images:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: The image of the harnesses
        uses: docker/build-push-action@v6
        with:
          context: agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/llmnative-runner-agent:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/llmnative-runner-agent:latest
      - name: The runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: RUNNER_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/llmnative-runner:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/llmnative-runner:latest

  github-release:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install.sh, its checksum and the compose files
        run: |
          cd install
          sha256sum install.sh | sed 's/  .*/  install.sh/' > install.sh.sha256
          notes="$(awk "/^## \[${GITHUB_REF_NAME#v}\]/{found=1; next} /^## \[/{if(found) exit} found" ../CHANGELOG.md)"
          gh release create "$GITHUB_REF_NAME" install.sh install.sh.sha256 compose.yaml coolify.yaml --title "$GITHUB_REF_NAME" --notes "${notes:-Release $GITHUB_REF_NAME}" \
            || gh release upload "$GITHUB_REF_NAME" install.sh install.sh.sha256 compose.yaml coolify.yaml --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Already on npm? Then nothing to publish
        id: published
        run: |
          if npm view "$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then echo "done=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.published.outputs.done != 'true'
        run: npm publish --access public
